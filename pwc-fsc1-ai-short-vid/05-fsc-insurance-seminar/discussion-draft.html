<div class="eyebrow" data-e>討論稿 v2.1｜與 Sam 討論用｜已加入定位分析與 Sam 出鏡</div>
<h1 data-e>如果出錯的是 AI，誰來賠？</h1>
<p data-e class="sub">FSC1 保險組研討會 AI 短片企劃（約 80 秒）</p>
<div class="meta"><span data-e>用途：外部研討會，由 Sam 在seminar 播放/share</span><span data-e>觀眾：保險公司主管</span><span data-e>形式：劇情型＋觀點型，對話情境、無旁白</span><span data-e>日期：2026-10-13</span></div>

<p data-e class="lead">再保負責讓 AI 風險「保得起」，FSC1 保險組負責讓保險公司「做得到」。我們的定位是 <b>AI 保險的落地夥伴</b>：商品框架有了之後，系統、數據、會計資本與 AI 治理，由我們陪保險公司接起來。</p>

<h2 data-e><span class="n">01</span>請 Sam 先決定的 8 件事</h2>
<ol class="decide">
<li data-e><b>主題方向與定位可以嗎？</b>以「AI 表現保險」這個新趨勢切入，把我們定位成「AI 保險的落地夥伴」，而不是商品設計者（見 02）。</li>
<li data-e><b>結尾 CTA 選 A 還是 B？</b>A：「下一步：從一次 AI 模型風險評估開始」（直接對應現有 AI 治理服務）；B：「下一步：從一次 AI 保險落地準備度評估開始」（範圍較廣，需確認團隊有沒有這個評估方法，見 07）。</li>
<li data-e><b>鏡頭 6 的台詞選哪一版？</b>原版講方法（先評估、再分層）；新版講分工（商品交給再保公司，我們陪你一起接起來），見 05。</li>
<li data-e><b>外部場合能不能列出案例類型？</b>車險理賠案件分級模型、客戶經營模型與 NPS、IFRS 17 系統導入（不放客戶名稱）。不行的話，只列四條服務線。</li>
<li data-e><b>「團隊展望」只留一項可以嗎？</b>這次只把「企業 AI 客群分層」標為展望，其他落地需求都對應到現有服務（見 06）。</li>
<li data-e><b>企業端（投保企業）要不要納入？</b>投保企業的 AI 治理可能屬於所內其他團隊，也要注意和保險公司客戶之間的利益衝突。建議這支片只對保險公司說話（見 02 的三種觀眾）。</li>
<li data-e><b>Sam 本人出鏡可以嗎？</b>鏡頭 6 以 Sam 的照片生成合夥人角色，只出現、不開口說話（避免 AI 合成的聲音和 Sam 現場的聲音不同）。需要 Sam 書面同意，對外播放前建議一併送 Risk &amp; Quality。</li>
<li data-e><b>品牌露出與審查</b>：結尾卡是否放 PwC 標誌、是否需要送 Risk &amp; Quality 審查、研討會的播放時間與日期。</li>
</ol>

<h2 data-e><span class="n">02</span>為什麼找我們：我們的定位</h2>
<p data-e>觀眾會問：「市場上已經有保險公司和再保合作推出 AI 保險了，為什麼還要找顧問？」答案是：再保提供的是承保能力和商品框架，保險公司自己還要把商品接進系統、數據、會計與治理流程，這一段才是我們的工作。</p>
<div class="tbl"><table>
<tr><th data-e style="width:18%">面向</th><th data-e style="width:30%">再保提供的</th><th data-e style="width:30%">保險公司還要自己補的</th><th data-e>對應我們的服務</th></tr>
<tr><td data-e>系統</td><td data-e>商品條款與承保框架</td><td data-e>新商品接進核心系統、核保與理賠流程</td><td data-e><span class="tag now">核心系統顧問</span></td></tr>
<tr><td data-e>數據</td><td data-e>指標定義與觸發條件</td><td data-e>監控 AI 指標的數據來源、報表與 BI</td><td data-e><span class="tag now">數據應用</span></td></tr>
<tr><td data-e>會計與資本</td><td data-e>再保分出結構</td><td data-e>IFRS 17 計量、TW-ICS 資本影響</td><td data-e><span class="tag now">數據應用</span> <span class="tag now">專業人力委外</span></td></tr>
<tr><td data-e>治理</td><td data-e>核保時審查投保方的模型</td><td data-e>保險公司自己用的 AI 也要經得起監理檢視；核保團隊要懂得評估模型</td><td data-e><span class="tag now">AI 治理</span></td></tr>
<tr><td data-e>市場</td><td data-e>全球經驗與商品範本</td><td data-e>台灣市場哪些企業先買、怎麼分層</td><td data-e><span class="tag now">數據應用</span>的客戶經營模型；延伸到企業端屬 <span class="tag next">團隊展望</span></td></tr>
</table></div>
<h3 data-e>另外兩個理由</h3>
<ul>
<li data-e><b>中立</b>：我們不是任何一家再保的合作方，可以協助保險公司比較不同方案，站在保險公司這一邊。</li>
<li data-e><b>多數觀眾還沒開始</b>：研討會上大部分保險公司還沒推出 AI 保險，他們需要的是「如果要做，要先準備什麼」。</li>
</ul>
<h3 data-e>三種觀眾，三種需求</h3>
<div class="tbl"><table>
<tr><th data-e style="width:26%">觀眾</th><th data-e>他們的問題</th><th data-e style="width:30%">我們能談的</th></tr>
<tr><td data-e>已和再保合作的保險公司</td><td data-e>商品上了，系統、數據、會計接得住嗎？</td><td data-e>落地：核心系統、數據、IFRS 17／TW-ICS</td></tr>
<tr><td data-e>還沒開始的保險公司</td><td data-e>要不要做？先準備什麼？</td><td data-e>準備度評估、AI 治理基礎</td></tr>
<tr><td data-e>投保企業</td><td data-e>我的 AI 能不能被承保？</td><td data-e>可能屬所內其他團隊；須注意利益衝突，建議這支片不主打</td></tr>
</table></div>

<h2 data-e><span class="n">03</span>為什麼選這個題目</h2>
<div class="tbl"><table>
<tr><th data-e style="width:26%">趨勢</th><th data-e>重點（依公開報導整理）</th></tr>
<tr><td data-e>AI 成為新的可保風險</td><td data-e>2026 年台灣市場已出現企業 AI 專屬保險，保障 AI 未達約定效能指標造成的財務損失、額外費用、營運中斷與第三人責任。國際上的 AI 表現保險做法是：先約定可衡量的指標，例如準確率，未達標就觸發理賠。</td></tr>
<tr><td data-e>保險業自身的 AI 轉型</td><td data-e>57% 保險高層把生成式與代理型 AI 列為 2026 首要科技投資，負責任 AI 治理成為迫切議題（PwC《Reinventing insurance》）；美國 NAIC 把 AI 模型治理列為 2026 重點；ITC Asia 2026 的主軸是「別再只做試點」。</td></tr>
<tr><td data-e>和我們的服務直接相關</td><td data-e>商品框架可以向再保取得，但要在自家公司跑起來，需要系統、數據、會計資本與 AI 治理一起到位，正好對應 FSC1 保險組的四條服務線。</td></tr>
</table></div>
<p data-e class="note">片中不點名任何公司，只說「市場上已出現 AI 專屬保險」。</p>

<h2 data-e><span class="n">04</span>故事線</h2>
<p data-e><b>鉤子</b>：工廠的 AI 品檢誤判整批貨 → <b>衝突</b>：保單不一定賠 → <b>轉折</b>：AI 表現保險出現 → <b>新考題</b>：商品有了，但公司接得住嗎？ → <b>我們的角色</b>：AI 保險的落地夥伴，系統、數據、治理一起接 → <b>可複製</b>：同一套方法從個人保戶延伸到企業 → <b>收尾</b>：有新方案可以談 → <b>CTA</b>。</p>

<h2 data-e><span class="n">05</span>分鏡腳本</h2>
<div class="tbl"><table>
<tr><th data-e>#</th><th data-e>時間</th><th data-e style="width:28%">畫面</th><th data-e style="width:34%">台詞</th><th data-e>字卡／音效</th></tr>
<tr><td data-e>1</td><td data-e class="t">0–6 秒</td><td data-e>電子廠 AOI 品檢線，監視螢幕牆整片轉紅，輸送帶停下</td><td data-e>工程師阿凱：「這批⋯全部被判不良？」</td><td data-e>字卡<span class="q">「如果出錯的是 AI，誰來賠？」</span>；警示嗶聲</td></tr>
<tr><td data-e>2</td><td data-e class="t">6–13 秒</td><td data-e>工廠辦公室窗邊，財務協理拿著手機、按著額頭</td><td data-e>陳協理：「AI 判錯一整批貨，我們的保單賠嗎？」</td><td data-e>—</td></tr>
<tr><td data-e>3</td><td data-e class="t">13–20 秒</td><td data-e>經紀公司辦公桌，翻著保單條款</td><td data-e>經紀人佳穎：「傳統的產險跟資安險⋯不一定涵蓋。」</td><td data-e>章節字卡「AI 正在創造一種新的風險」</td></tr>
<tr><td data-e>4</td><td data-e class="t">22–32 秒</td><td data-e>產險公司會議室，副總指著大螢幕</td><td data-e>黃副總：「AI 沒達到約定的表現，損失就由保險來承擔。」</td><td data-e>螢幕「約定準確率 98%｜實際 95.2% → 觸發理賠」；字卡「市場上已出現 AI 專屬保險」</td></tr>
<tr><td data-e>5</td><td data-e class="t">32–42 秒</td><td data-e>核保主管放下筆提問，副總沉思</td><td data-e>怡君：「再保公司給了商品，可是系統、數據、模型評估，我們接得住嗎？」</td><td data-e>問題卡：系統接得上嗎？／數據跟得上嗎？／自己的 AI 經得起檢視嗎？</td></tr>
<tr><td data-e>6</td><td data-e class="t">42–54 秒</td><td data-e>FSC1 顧問欣怡在白板畫出落地藍圖，合夥人 Sam 站在一旁（不開口），保險公司團隊點頭</td><td data-e>顧問欣怡（二選一）：<br>原版：「先評估 AI 模型的風險，再把企業的使用情境分層，商品跟核保才有依據。」<br>新版：「商品交給再保公司，系統、數據、治理，我們陪你一起接起來。」</td><td data-e>標籤「FSC1 保險組」；白板「系統 × 數據 × 治理」（原版則為「AI 模型風險 × 產業 × 應用情境」）</td></tr>
<tr><td data-e>7</td><td data-e class="t">54–66 秒</td><td data-e>左：個人保戶的分層畫面（沿用前一支樣片）；右：工廠品檢線</td><td data-e>—</td><td data-e>字卡「同一套方法：從個人保戶的客戶經營，延伸到企業的 AI 風險」；接服務卡（見 06）</td></tr>
<tr><td data-e>8</td><td data-e class="t">66–74 秒</td><td data-e>傍晚，品檢螢幕恢復綠色，協理接起電話微笑</td><td data-e>佳穎（電話）：「陳協理，有新的方案可以談了。」<br>陳協理：「好，我們從這裡開始。」</td><td data-e>—</td></tr>
<tr><td data-e>結尾</td><td data-e class="t">74–80 秒</td><td data-e>深色結尾卡</td><td data-e>—</td><td data-e>見 07</td></tr>
</table></div>
<p data-e class="note">除 Sam 外所有角色皆為 AI 原創；Sam 以本人照片製作角色設定圖，須先取得本人同意，片中不開口說話。畫面中的文字、數字與儀表板一律後製，避免 AI 亂碼。鏡頭 6 若選新版，只需重新生成這一段（約 10 秒）。</p>

<h2 data-e><span class="n">06</span>服務卡：落地需求 → 我們的服務</h2>
<p data-e>依《FSC1 保險組主要服務內容》。左欄是保險公司推 AI 保險時要補的落地需求，右欄是對應的現有服務；只有企業端的客群分層標為團隊展望，畫面上用不同顏色區分。</p>
<div class="tbl"><table>
<tr><th data-e style="width:36%">落地需求</th><th data-e>我們的服務</th></tr>
<tr><td data-e>新商品接進核心系統、核保與理賠流程</td><td data-e><span class="tag now">核心系統顧問</span> 系統架構規劃、流程數位化、新核心系統導入</td></tr>
<tr><td data-e>監控 AI 指標的數據、報表與 BI</td><td data-e><span class="tag now">數據應用</span> 數據治理、分析與報告、BI；案例類型：車險理賠案件分級模型</td></tr>
<tr><td data-e>IFRS 17 計量與 TW-ICS 資本影響</td><td data-e><span class="tag now">數據應用</span> <span class="tag now">專業人力委外</span> IFRS 17 系統導入、數據平台與核心系統專案人力</td></tr>
<tr><td data-e>自家 AI 的治理，核保團隊會評估模型</td><td data-e><span class="tag now">AI 治理</span> AI 倫理規範建立、模型風險評估與監控、合規與政策建議</td></tr>
<tr><td data-e>台灣市場哪些企業先買、怎麼分層</td><td data-e><span class="tag next">團隊展望</span> 企業 AI 客群分層，從現有的客戶經營模型與 NPS 延伸</td></tr>
</table></div>

<h2 data-e><span class="n">07</span>結尾卡與 CTA</h2>
