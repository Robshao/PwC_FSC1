<h1 data-e>如果出錯的是 AI，誰來賠？</h1>
<p data-e class="sub">FSC1 保險組研討會 AI 短片企劃（約 80 秒）</p>
<div class="meta"><span data-e>用途：外部研討會，由 Sam 在台上播放</span><span data-e>觀眾：保險公司主管</span><span data-e>形式：劇情型＋觀點型，對話情境、無旁白</span><span data-e>日期：2026-10-13</span></div>

<p data-e class="lead">AI 正在創造一種新的可保風險。保險業要「保 AI」，也要「用 AI」；FSC1 保險組以現有的 AI 治理與數據應用服務為基礎，陪保險業設計 AI 時代的商品與治理。</p>

<h2 data-e><span class="n">01</span>請 Sam 先決定的 5 件事</h2>
<ol class="decide">
<li data-e><b>主題方向可以嗎？</b>以「AI 表現保險」這個新趨勢當切入點，帶出 FSC1 保險組的 AI 治理與數據應用服務。</li>
<li data-e><b>結尾 CTA：「下一步：從一次 AI 模型風險評估開始」可以嗎？</b>它對應現有服務「AI 治理：模型風險評估與監控」。需要確認團隊能接住會後的詢問。</li>
<li data-e><b>外部場合能不能列出案例類型？</b>車險理賠案件分級模型、客戶經營模型與 NPS、IFRS 17 系統導入（不放客戶名稱）。不行的話，只列四條服務線。</li>
<li data-e><b>「團隊展望」的兩項方向，Sam 同意對外說嗎？</b>AI 風險商品策略與企業客群分層、與再保合作的 AI 表現核保框架。</li>
<li data-e><b>品牌露出與審查</b>：結尾卡是否放 PwC 標誌、是否需要送 Risk &amp; Quality 審查、研討會的播放時間與日期。</li>
</ol>

<h2 data-e><span class="n">02</span>為什麼選這個題目</h2>
<div class="tbl"><table>
<tr><th data-e style="width:26%">趨勢</th><th data-e>重點（依公開報導整理）</th></tr>
<tr><td data-e>AI 成為新的可保風險</td><td data-e>2026 年台灣市場已出現企業 AI 專屬保險，保障 AI 未達約定效能指標造成的財務損失、額外費用、營運中斷與第三人責任。國際上的 AI 表現保險做法是：先約定可衡量的指標，例如準確率，未達標就觸發理賠。</td></tr>
<tr><td data-e>保險業自身的 AI 轉型</td><td data-e>57% 保險高層把生成式與代理型 AI 列為 2026 首要科技投資，負責任 AI 治理成為迫切議題（PwC《Reinventing insurance》）；美國 NAIC 把 AI 模型治理列為 2026 重點；ITC Asia 2026 的主軸是「別再只做試點」。</td></tr>
<tr><td data-e>和我們的服務直接相關</td><td data-e>AI 商品要核保，第一步是評估模型風險；保險公司自己的 AI 要上線，也需要治理與數據基礎。這兩點正好對應 FSC1 保險組的「AI 治理」與「數據應用」。</td></tr>
</table></div>
<p data-e class="note">片中不點名任何公司，只說「市場上已出現 AI 專屬保險」。</p>

<h2 data-e><span class="n">03</span>故事線</h2>
<p data-e><b>鉤子</b>：工廠的 AI 品檢誤判整批貨 → <b>衝突</b>：保單不一定賠 → <b>轉折</b>：AI 表現保險出現 → <b>新考題</b>：保險公司不知道先賣給誰、怎麼核保 → <b>我們的角色</b>：先評估 AI 模型風險、再分層 → <b>可複製</b>：同一套方法從個人保戶延伸到企業 → <b>收尾</b>：有新方案可以談 → <b>CTA</b>。</p>

<tr><th data-e>#</th><th data-e>時間</th><th data-e style="width:28%">畫面</th><th data-e style="width:34%">台詞</th><th data-e>字卡／音效</th></tr>
<tr><td data-e>1</td><td data-e class="t">0–6 秒</td><td data-e>電子廠 AOI 品檢線，監視螢幕牆整片轉紅，輸送帶停下</td><td data-e>工程師阿凱：「這批⋯全部被判不良？」</td><td data-e>字卡<span class="q">「如果出錯的是 AI，誰來賠？」</span>；警示嗶聲</td></tr>

<p data-e class="note">所有角色皆為 AI 原創，不生成任何真實人物；畫面中的文字、數字與儀表板一律後製，避免 AI 亂碼。</p>

<h2 data-e><span class="n">05</span>服務卡：現有服務與團隊展望分開呈現</h2>
<p data-e>依《FSC1 保險組主要服務內容》。左欄是已經在做的服務，右欄是規劃方向，畫面上用不同顏色區分，避免把展望說成現有服務。</p>
<div class="cols">
<div class="col"><h3 data-e><span class="tag now">我們已經在做</span></h3><ul>
<li data-e><b>AI 治理</b>：AI 倫理規範建立、模型風險評估與監控、合規與政策建議</li>
<li data-e><b>數據應用</b>：數據治理、分析與報告、BI；案例類型：車險理賠案件分級模型、客戶經營模型與 NPS、IFRS 17 系統導入</li>
<li data-e><b>核心系統顧問</b>：系統架構規劃、流程數位化、新核心系統導入</li>
<li data-e><b>專業人力委外</b>：IFRS 17 數據平台與核心系統專案人力</li></ul></div>
<div class="col"><h3 data-e><span class="tag next">團隊展望</span></h3><ul>
<li data-e>AI 風險商品策略與企業客群分層</li>
<li data-e>與再保合作的 AI 表現核保與評估框架</li></ul>
<p data-e class="note" style="margin-top:10px">這兩項都是從現有的 AI 治理（模型風險評估）和數據應用（客戶經營模型）延伸出來的。</p></div>
</div>

<h2 data-e><span class="n">06</span>結尾卡與 CTA</h2>
<div class="endcard">
<div class="big" data-e>AI 時代的保險，我們一起設計。</div>
<div class="cta" data-e>下一步：從一次 AI 模型風險評估開始</div>
<div data-e>PwC FSC1 保險組｜AI 治理・數據應用・核心系統顧問</div>
<div class="small" data-e style="margin-top:10px">情境為虛構示意；標示「團隊展望」者為規劃方向</div>
</div>
<p data-e><b>為什麼選這個 CTA</b>：一、它對應現有服務，Sam 講完，團隊接得住會後的詢問；二、它和片中的問題是同一條邏輯，AI 表現保險要核保，第一步就是評估模型風險；三、它比「歡迎與我們聊聊」具體，主管知道會後可以找我們做什麼。</p>
